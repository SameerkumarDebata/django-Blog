
{% comment %} Header part {% endcomment %}
{% load static %}
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Django Blog</title>

    <!-- Bootstrap 4 CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">

            <div class="col-7">
                <a class="blog-header-logo text-dark" href="/">
                    Django Blog
                </a>
            </div>

            <div class="col-5 d-flex justify-content-end align-items-center">
                <a class="btn btn-sm btn-warning" href="#">
                    Sign in
                </a>

                <a class="btn btn-sm btn-outline-secondary ml-2" href="#">
                    Register
                </a>
            </div>

        </div>
    </header>

    <!-- Navigation -->
    <div class="nav-scroller py-1 mb-3">
    <nav class="nav d-flex justify-content-between">

        {% for cat in categories %}
            <a class="p-2 text-muted"
               href="{% url 'posts_by_category' cat.id %}">
                {{ cat.category_name }}
            </a>
        {% empty %}
            <span class="p-2 text-muted">
                No categories available
            </span>
        {% endfor %}

    </nav>
</div>
      <!--main content -->
      {% block content%}
      {% endblock  %}


    <!-- Footer -->
<footer class="blog-footer text-center py-4 mt-4">
    <p>
        Django Blog built with ❤️ by
        <a href="/">Sameer</a>
    </p>

    <p class="mb-0">
        <a href="#">Back to top</a>
    </p>
</footer>

</body>
</html>
